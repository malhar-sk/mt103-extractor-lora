# One command: docker compose up -d
# Host ports are configurable via .env (see .env.example).
services:
  ollama:
    image: ollama/ollama:latest
    container_name: mt103-ollama
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-21434}:11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models:ro
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: serve/Dockerfile
    container_name: mt103-api
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      FT_MODEL: ${FT_MODEL:-mt103-extractor}
      BASE_MODEL: ${BASE_MODEL:-qwen2.5:0.5b-instruct}
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 512m
    cpus: "0.5"

volumes:
  ollama_data:
