name: podman-compat

# Checks that the same docker-compose.yml runs under rootless Podman (podman-compose),
# with no Docker involved. Manual only, so it doesn't add load to every push.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/podman.yml"]

jobs:
  podman:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          podman version
          pip install --user podman-compose==1.3.0
          podman-compose version
      - name: Configure
        run: cp .env.example .env
      - name: Build and start (rootless Podman)
        run: podman-compose up -d --build
      - name: API is up
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18000/health && exit 0; sleep 5; done
          podman-compose logs --tail 40; exit 1
      - name: Pull the base model into Ollama (~400 MB)
        run: podman-compose exec -T ollama ollama pull qwen2.5:0.5b-instruct
      - name: /extract on a messy payment email (base model fallback, CPU)
        run: |
          curl -fsS -m 300 -XPOST http://127.0.0.1:18000/extract -H 'Content-Type: application/json' \
            -d '{"text":"Hi team, pls send Rs 1,25,000.50 to Coromandel Logistics Pvt Ltd a/c 54150945237 at HDFCINBB, value 05/12/2026, our ref TXN778812, charges shared. Remitter: Helix Pharma Ltd a/c 726045614514. Invoice INV 2231. Thx"}' \
            | tee extract.json
          python3 - <<'EOF'
          import json
          d = json.load(open("extract.json"))
          print(json.dumps(d, indent=1)[:1500])
          assert isinstance(d, dict) and d, "empty response"
          EOF
      - name: Diagnostics
        if: always()
        run: |
          podman-compose ps || true
          podman-compose logs --tail 30 || true
      - name: Tear down
        if: always()
        run: podman-compose down -v || true
